name: Security and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            user-app/package-lock.json
            admin-app/package-lock.json
            supabase/functions/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Scan tracked files and history for secrets
        run: python3 tools/scan_secrets.py --history
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix user-app
          npm ci --prefix admin-app
      - name: Check known dependency advisories
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix user-app --audit-level=moderate
          npm audit --prefix admin-app --audit-level=moderate
          npm audit --prefix supabase/functions --package-lock-only --audit-level=moderate
      - name: Test database authorization and money invariants
        run: npm test
      - name: Check and test Edge Functions
        run: |
          deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts
          deno test --frozen --allow-env --config supabase/functions/deno.json supabase/functions/shared/*.test.ts
      - name: Build both websites
        run: |
          npm run build --prefix user-app
          npm run build --prefix admin-app
